name = "geoscore-payments"
main = "payments.js"
compatibility_date = "2024-09-25"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "geoscore-db"
database_id = "372d4f13-35da-4878-b9d2-916b90fc11ad"

# Secrets (set via `wrangler secret put`):
# CREEM_WEBHOOK_SECRET  - webhook signing secret from Creem dashboard
# CREEM_API_KEY         - Creem API key
# GEOSCORE_API_TOKEN    - token for protecting the legacy status API
# RESEND_API_KEY        - Resend API key for sending verification emails
# JWT_SECRET            - HMAC secret for signing JWT session tokens
# GOOGLE_CLIENT_ID      - Google OAuth Client ID

# Routes
# After deploying, set up a custom domain or use the workers.dev subdomain:
# https://geoscore-payments.<your-subdomain>.workers.dev

# Webhook URL to register in Creem dashboard:
# https://geoscore-payments.<your-subdomain>.workers.dev/webhook